name: Fix CINEORA room panel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair room panel markup and CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'</section>\s*</div>\s*<aside class="side-card" id="sideCard">', '</section>\n    <aside class="side-card" id="sideCard">', s, count=1)
          if n:
              s = s2
          css = r'''\n<style id="cineora-room-top-final-fix">
/* FINAL: верхняя панель комнаты всегда занимает всю ширину */
.room-view.show > .room-top{
  display:grid!important;
  grid-template-columns:auto minmax(180px,1fr) auto!important;
  align-items:center!important;
  width:100%!important;
  min-width:0!important;
  height:72px!important;
  min-height:72px!important;
  margin:0!important;
  padding:0 24px!important;
  position:sticky!important;
  top:0!important;
  z-index:9000!important;
  box-sizing:border-box!important;
  flex-wrap:nowrap!important;
}
.room-view.show > .room-top .room-brand{min-width:max-content!important}
.room-view.show > .room-top .top-invite{min-width:0!important;justify-self:center!important;max-width:min(420px,100%)!important;overflow:hidden!important}
.room-view.show > .room-top .room-actions{min-width:0!important;max-width:100%!important;justify-self:end!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important}
.room-view.show > .room-top .room-actions::-webkit-scrollbar{display:none!important}
.room-view.show > .room-top .room-actions .room-code,
.room.view.show > .room-top .room-actions .room-btn{flex:0 0 auto!important;white-space:nowrap!important}
@media(max-width:1100px){
  .room-view.show > .room-top{grid-template-columns:auto minmax(120px,1fr) auto!important;padding:0 16px!important}
  .room-view.show > .room-top .room-actions .room-title-chip,
  .room-view.show > .room-top .room-actions .room-mode-chip{display:none!important}
}
@media(max-width:800px){
  .room-view.show > .room-top{display:flex!important;flex-wrap:wrap!important;height:auto!important;min-height:64px!important;padding:9px 12px!important;gap:7px!important}
  .room-view.show > .room-top .room-actions{order:2!important;max-width:100%!important;width:auto!important;margin-left:auto!important}
  .room-view.show > .room-top .top-invite{order:3!important;width:100%!important;max-width:none!important;justify-self:auto!important}
}
.room-view.cinema-mode > .room-top{grid-template-columns:auto minmax(120px,1fr) auto!important}
.room-view.cinema-mode > .room-top .room-actions{overflow-x:auto!important;scrollbar-width:none!important}
</style>\n'''
          if 'id="cineora-room-top-final-fix"' not in s:
              s=s.replace('</head>', css+'</head>', 1)
          p.write_text(s, encoding='utf-8')
          print('markup_removed=', n)
          print('css_added=', 'id="cineora-room-top-final-fix"' in s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix CINEORA room top panel'
          git push
          rm -f .github/workflows/fix-room-panel.yml
          git add -u .github/workflows/fix-room-panel.yml
          git diff --cached --quiet || git commit -m 'Remove one-shot room panel workflow'
          git push
