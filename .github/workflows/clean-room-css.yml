name: Clean CINEORA room CSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-room-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate room/cinema CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          remove_ids = {
            'cineora-room-like-home','cineora-player-size-fix','cineora-soft-theme','cineora-dark-theme','cineora-mobile-room',
            'cineora-full-player-fix','cineora-player-status-layout','cineora-final-room-layout','cineora-player-clean-controls',
            'cineora-remove-player-widget','cineora-emoji-fix','cineora-emoji-final-fix','cineora-emoji-hard-fix',
            'cineora-connection-fix','cineora-final-polish','cineora-unified-ui','cineora-final-visual-polish',
            'cineora-theme-final','cineora-room-finish','cineora-large-video-room','cineora-mobile-final',
            'cineora-micro-interactions','cineora-room-premium-upgrade','cineora-no-white-ui','cineora-phone-room-final',
            'cineora-phone-layout-stability','cineora-cinema-mode','cineora-room-chat-final-fix','cineora-chat-improvements',
            'cineora-chat-stickers','cineora-dark-surface-fix'
          }

          for sid in remove_ids:
            text = re.sub(r'<style\\s+id=["\\']' + re.escape(sid) + r'["\\'][^>]*>.*?</style>\\s*', '', text, flags=re.I|re.S)

          # Remove the old anonymous room base style (the one immediately after the homepage CSS).
          text = re.sub(r'<style>\\s*\\.room-view\\{display:none;min-height:100vh;.*?</style>\\s*', '', text, count=1, flags=re.I|re.S)

          final_css = r'''/* CINEORA — ЕДИНЫЙ ROOM/CINEMA LAYOUT */
          .room-view{display:none;min-height:100vh;position:relative;background:linear-gradient(135deg,#eee7eb 0%,#e5e1e8 48%,#dfe6eb 100%);color:#403943;overflow-x:hidden}
          .room-view.show{display:block}
          .room-top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;position:sticky;top:0;z-index:900;background:rgba(250,247,250,.94);backdrop-filter:blur(16px);border-bottom:1px solid #d5cbd7}
          .room-brand{color:#403943;text-decoration:none;cursor:pointer;font:500 25px "Playfair Display";letter-spacing:.14em;white-space:nowrap}
          .room-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0;flex-wrap:wrap}
          .room-code,.room-btn{height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:0 13px;background:#fdfafd;border:1px solid #d5cbd7;box-shadow:0 2px 8px rgba(70,55,70,.04);font-size:12px;font-weight:600;color:#4b4350}
          .room-code{color:#706774}.room-code b{color:#49434d}.room-btn{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}.room-btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(70,55,70,.08);background:#f1e9f2}.room-btn:active{transform:translateY(0) scale(.98)}
          .room-btn.primary{background:#c9aec9;border-color:#c9aec9;color:#342d37}.room-btn.leave{color:#a56f76!important;background:#fff8f9}
          .room-layout{width:min(1480px,calc(100% - 48px));margin:24px auto 30px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
          .watch-card,.side-card{min-width:0;background:rgba(255,252,255,.93);border:1px solid #d3cad5;border-radius:24px;box-shadow:0 16px 45px rgba(82,68,82,.12);overflow:hidden}
          .watch-card{width:100%}.watch-head{min-height:70px;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd4de;background:#fffafd}.watch-title{font:500 24px "Playfair Display";color:#443e47}.source-pill{padding:7px 10px;border-radius:999px;background:#f1ebf2;border:1px solid #e0d6e2;color:#817585;font-size:11px}.watch-head-tools{display:flex;align-items:center;gap:7px;margin-left:auto}.watch-head-tools .room-btn{white-space:nowrap}
          .player-wrap{position:relative;width:100%;aspect-ratio:16/9;height:auto;min-height:0;overflow:hidden;background:#0c0c0d;display:block}.player-wrap>#universalPlayer{position:absolute;inset:0;width:100%;height:100%;display:block}.player-wrap #universalPlayer>iframe,.player-wrap #universalPlayer>video,.player-wrap #universalPlayer>.universal-player,.player-wrap #ytPlayer,.player-wrap #ytPlayer>iframe{position:absolute;inset:0;width:100%;height:100%;min-width:0;min-height:0;border:0;display:block}.player-wrap video{object-fit:contain;background:#000}.player-wrap iframe{border:0;background:#000}.empty-player{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:34px;background:radial-gradient(circle at 50% 35%,rgba(216,198,223,.16),transparent 34%),linear-gradient(145deg,#11120f,#18161b);color:#aaa1aa}.empty-player strong{font:500 27px "Playfair Display";color:#f1eaf2;margin-bottom:7px}.empty-player span{max-width:360px;line-height:1.5}.player-wrap:not(.no-media)>.empty-player{display:none}
          .media-bar{padding:13px 15px;display:flex;gap:8px;border-top:1px solid #e3dbe3;background:#faf7f9}.media-bar input{flex:1;min-width:0;height:42px;padding:0 13px;border-radius:12px;background:#fff;color:#403943;border:1px solid #d8cdd9}.media-bar .room-btn{height:42px}.player-tools{display:none!important}.sync-note{display:none!important}
          .side-card{display:flex;flex-direction:column;min-height:0;height:calc(100vh - 100px);max-height:900px;position:sticky;top:84px}.side-title{padding:16px 18px 10px;font:500 20px "Playfair Display";color:#4b424c}.participants{padding:0 15px 14px;display:flex;flex-direction:column;gap:6px;max-height:205px;overflow:auto}.person-row,.participant-card{min-height:50px;padding:9px 11px;border-radius:11px;background:#f8f3f7;border:1px solid #e6dce6}.person-row{display:flex;align-items:center;justify-content:space-between}.person-name{font-size:13px}.person-time{font-size:10px;color:#776c76}.invite-card{margin:14px!important;padding:16px!important;border-radius:18px!important}.voice-panel{flex:0 0 auto;background:#f6eef4;border-top:1px solid #e1d7e1;padding:12px}.chat{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;background:#fffafd;border-top:1px solid #ddd4de;overflow:hidden}.chat-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 11px!important;flex:0 0 auto}.chat-title-row .side-title{padding:0}.chat-messages{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px;background:#fffafd;display:flex;flex-direction:column;gap:9px}.chat-msg{padding:10px 12px;border:1px solid #eee6ee;background:#f1ebf2;border-radius:13px}.chat-msg b{font-size:11px;color:#6d536c}.chat-msg span{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:#4e4750;white-space:pre-wrap}.chat-msg small{display:block;margin-top:5px;color:#938995;font-size:9px}.chat-form{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding:11px;background:#eee6ec;border-top:1px solid #ddd4de}.chat-form input{flex:1;min-width:0;height:42px;border-radius:12px;padding:0 11px;background:#faf7fa;color:#403943;border:1px solid #cfc1cc}.chat-form>button{min-width:46px;height:42px;border:0;border-radius:12px;background:#c8aec6;color:#403746}.emoji-wrap{position:relative}.emoji-toggle{width:42px!important;min-width:42px!important;height:42px!important;border-radius:12px!important}.emoji-picker{position:absolute!important;left:0!important;right:auto!important;bottom:54px!important;width:292px!important;max-width:min(292px,calc(100vw - 24px))!important;max-height:280px!important;overflow-y:auto!important;box-sizing:border-box!important;padding:10px!important;z-index:1000!important}.emoji-picker.hidden{display:none!important}.emoji-picker:not(.hidden){display:block!important}.fullscreen-chat{display:none}
          .room-view.cinema-mode{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100dvh;z-index:500;overflow:hidden;background:#0f0e12;color:#eee8f0}.room-view.cinema-mode .room-top{height:60px;min-height:60px;position:relative;top:auto;z-index:950;padding:0 20px;background:rgba(24,21,28,.96);border-bottom:1px solid #403844}.room-view.cinema-mode .room-brand{color:#f1eaf2}.room-view.cinema-mode .room-code,.room-view.cinema-mode .room-btn{background:#29232e;color:#e8dfea;border-color:#49404e;box-shadow:none}.room-view.cinema-mode .room-btn.primary{background:#b695b3;color:#211b23;border-color:#b695b3}.room-view.cinema-mode .room-layout{width:100%;height:calc(100dvh - 60px);min-height:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;align-items:stretch}.room-view.cinema-mode .watch-card{height:100%;min-width:0;border:0;border-radius:0;background:#09090b;box-shadow:none;display:flex;flex-direction:column}.room-view.cinema-mode .watch-head{flex:0 0 58px;min-height:58px;background:#17141a;border-color:#302a33;color:#f1eaf2}.room-view.cinema-mode .watch-title{color:#f1eaf2}.room-view.cinema-mode .player-wrap{flex:1 1 auto;height:auto;min-height:0;aspect-ratio:auto;border-radius:0}.room-view.cinema-mode .media-bar{display:none}.room-view.cinema-mode .side-card{width:380px;min-width:380px;max-width:380px;height:100%;min-height:0;max-height:none;position:relative;top:auto;border:0;border-left:1px solid #403844;border-radius:0;background:#1f1b22;box-shadow:none}.room-view.cinema-mode .side-title{color:#f1eaf2}.room-view.cinema-mode .participants{max-height:125px}.room-view.cinema-mode .chat{min-height:0;background:#1d1920;border-color:#403844}.room-view.cinema-mode .chat-messages{background:#1d1920}.room-view.cinema-mode .chat-msg{background:#29232e;border-color:#403844}.room-view.cinema-mode .chat-msg span{color:#eee6ef}.room-view.cinema-mode .chat-form{background:#241f28;border-color:#403844}.room-view.cinema-mode .chat-form input{background:#17141a;color:#eee6ef;border-color:#4a404d}.room-view.cinema-mode .voice-panel{background:#251f29;border-color:#403844}.room-view.cinema-mode .emoji-picker{z-index:2000}.room-view.cinema-mode .cinema-chat-open-btn{display:none!important}.room-view.cinema-mode .player-wrap iframe,.room-view.cinema-mode .player-wrap video{object-fit:contain}body.cineora-cinema-active{overflow:hidden}
          @media(max-width:1000px){.room-top{height:auto;min-height:64px;padding:10px 12px;position:relative}.room-layout{width:calc(100% - 20px);margin:12px auto 20px;grid-template-columns:1fr;gap:12px}.player-wrap{aspect-ratio:16/9}.side-card{position:static;height:auto;max-height:none;min-height:460px}.room-view.cinema-mode .room-layout{display:block;height:calc(100dvh - 56px);position:relative}.room-view.cinema-mode .watch-card{height:100%}.room-view.cinema-mode .side-card{position:absolute;top:0;right:0;width:min(380px,88vw);min-width:0;max-width:none;height:100%;transform:translateX(102%);z-index:970}.room-view.cinema-mode.cinema-chat-open .side-card{transform:translateX(0)}.room-view.cinema-mode .cinema-chat-open-btn{display:inline-flex!important}.room-view.cinema-mode .room-top{height:56px;min-height:56px}.room-view.cinema-mode .watch-head{display:none}}
          @media(max-width:700px){.room-top{min-height:64px}.room-brand{font-size:20px}.room-actions{max-width:78%;gap:6px}.room-actions .room-code,.room-actions .room-title-chip,.room-actions .room-mode-chip,#changeName{display:none}.room-layout{width:100%;margin:8px 0 14px;gap:8px}.watch-card,.side-card{border-radius:16px}.watch-head{min-height:58px;padding:12px 13px}.watch-title{font-size:19px}.player-wrap{aspect-ratio:16/9;min-height:0}.media-bar{padding:9px;display:grid;grid-template-columns:minmax(0,1fr) auto}.media-bar input{grid-column:1/-1;width:100%}.side-card{min-height:0}.participants{max-height:180px}.chat{min-height:300px}.chat-messages{padding:10px}.chat-form{padding:8px}.room-view.cinema-mode .room-top{height:52px;min-height:52px}.room-view.cinema-mode .room-layout{height:calc(100dvh - 52px)}.room-view.cinema-mode .side-card{width:min(92vw,360px)}}
          @media(prefers-reduced-motion:reduce){.room-btn,.chat-msg,.person-row{transition:none!important;animation:none!important}}
          '''

          marker='<!-- CINEORA ROOM/CINEMA FINAL LAYOUT -->'
          text=re.sub(r'<!-- CINEORA ROOM/CINEMA FINAL LAYOUT -->.*?</style>', '', text, flags=re.I|re.S)
          block=marker+'\n<style id="cineora-room-cinema-final">\n'+final_css+'\n</style>'
          text=text.replace('</head>', block+'\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleaned index and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/clean-room-css.yml
          git rm .github/workflows/clean-room-css.yml
          git commit -m "Clean duplicate room and cinema CSS"
          git push