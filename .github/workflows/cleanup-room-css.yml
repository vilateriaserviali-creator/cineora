name: CINEORA cleanup room CSS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove conflicting repair layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          for style_id in ['cineora-room-panel-restore', 'cineora-room-final-repair']:
              pattern = rf'<style id="{re.escape(style_id)}">.*?</style>\s*'
              s, n = re.subn(pattern, '', s, count=1, flags=re.S)
              print(style_id, 'removed:', n)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name 'cineora-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/cleanup-room-css.yml
          git rm .github/workflows/cleanup-room-css.yml
          git commit -m 'Remove conflicting room panel repair CSS'
          git push