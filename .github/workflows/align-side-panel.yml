name: CINEORA align side panel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply alignment CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="cineora-side-panel-alignment">'
          if marker not in s:
              css = '''\n<style id="cineora-side-panel-alignment">\n/* CINEORA — правая панель на одном уровне с карточкой «Совместный просмотр» */\n@media (min-width:701px){\n  .room-view.show > .room-layout{\n    align-items:stretch !important;\n  }\n  .room-view.show > .room-layout > .side-card{\n    align-self:stretch !important;\n    position:relative !important;\n    top:auto !important;\n    height:auto !important;\n    min-height:100% !important;\n    max-height:none !important;\n    margin:0 !important;\n  }\n  .room-view.show > .room-layout > .watch-card{\n    height:auto !important;\n    min-height:100% !important;\n  }\n}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'cineora-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/align-side-panel.yml
          git commit -m 'Align participants panel with watch card' || exit 0
          git rm .github/workflows/align-side-panel.yml
          git commit -m 'Remove temporary panel alignment workflow'
          git push