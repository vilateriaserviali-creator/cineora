<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNEVIA — Достижения</title><link rel="stylesheet" href="/profile.css"></head><body><main class="profile-shell"><a class="profile-back" href="/profile.html">← Профиль</a><section class="profile-card"><div class="profile-identity"><h1>🏆 Достижения</h1><p>Твои достижения в LUNEVIA</p></div><div id="achievementsGrid" class="achievement-grid" style="margin-top:22px"></div></section></main><script src="/achievements.js"></script><script>const grid=document.getElementById('achievementsGrid');const state=JSON.parse(localStorage.getItem('luneviaAchievements')||'{}');const items=[['first-room','🎬','Первая комната','Создай свою первую комнату.'],['first-message','💬','На связи','Отправь первое сообщение в чате.'],['movie-night','🍿','Киноман','Посмотри видео 60 минут.'],['styled-profile','✦','Свой стиль','Настрой аватар, рамку или маскота.']];grid.innerHTML=items.map(([id,icon,title,text])=>{const on=!!state[id];return `<article class="achievement-card ${on?'unlocked':'locked'}"><div class="achievement-icon">${icon}</div><div><b>${title}</b><small>${on?'Получено':text}</small></div></article>`}).join('');</script></body></html>
